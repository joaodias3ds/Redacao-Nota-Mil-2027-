<!-- @dsCard group="Spacing" viewport="700x200" name="Bordas e sombras" subtitle="Bordas discretas primeiro; sombra só para separar camadas" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Bordas e sombras</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;font-family:var(--font-body);color:var(--text-primary)}.r{display:flex;gap:12px;flex-wrap:wrap}.c{display:flex;flex-direction:column;gap:8px}.m{font:500 12px/1.4 var(--font-body);color:var(--text-muted)}.n{font:600 13px/1.3 var(--font-body)}.hex{font:12px/1.3 var(--font-mono);color:var(--text-secondary)}.sw{width:100%;height:64px;border-radius:8px;border:1px solid var(--border-subtle)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:16px;padding:8px;background:var(--bg-subtle);border-radius:12px"><div class="c"><div style="height:80px;border-radius:12px;background:#fff;border:1px solid var(--border-default)"></div><div class="n">Borda</div><div class="m">Cartões em repouso</div></div><div class="c"><div style="height:80px;border-radius:12px;background:#fff;box-shadow:var(--shadow-xs)"></div><div class="n">xs</div><div class="m">Aba segmentada</div></div><div class="c"><div style="height:80px;border-radius:12px;background:#fff;box-shadow:var(--shadow-sm);border:1px solid var(--border-default)"></div><div class="n">sm</div><div class="m">Cartão em hover</div></div><div class="c"><div style="height:80px;border-radius:12px;background:#fff;box-shadow:var(--shadow-md)"></div><div class="n">md</div><div class="m">Menus, dropdowns</div></div><div class="c"><div style="height:80px;border-radius:12px;background:#fff;box-shadow:var(--shadow-lg)"></div><div class="n">lg</div><div class="m">Modais, toasts</div></div></div></body></html>
