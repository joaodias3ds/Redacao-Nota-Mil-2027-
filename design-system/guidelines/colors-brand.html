<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Paleta principal</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;font-family:var(--font-body);color:var(--text-primary)}.r{display:flex;gap:12px;flex-wrap:wrap}.c{display:flex;flex-direction:column;gap:8px}.m{font:500 12px/1.4 var(--font-body);color:var(--text-muted)}.n{font:600 13px/1.3 var(--font-body)}.hex{font:12px/1.3 var(--font-mono);color:var(--text-secondary)}.sw{width:100%;height:64px;border-radius:8px;border:1px solid var(--border-subtle)}</style></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px"><div class="c" style="gap:4px;min-width:0"><div class="sw" style="background:#EC008B"></div><div class="n">Rosa da marca</div><div class="hex">#EC008B</div><div class="m">Identidade, destaques</div></div><div class="c" style="gap:4px;min-width:0"><div class="sw" style="background:#211F20"></div><div class="n">Grafite</div><div class="hex">#211F20</div><div class="m">Títulos e texto</div></div><div class="c" style="gap:4px;min-width:0"><div class="sw" style="background:#57585A"></div><div class="n">Cinza</div><div class="hex">#57585A</div><div class="m">Texto secundário</div></div><div class="c" style="gap:4px;min-width:0"><div class="sw" style="background:#FFFFFF"></div><div class="n">Branco</div><div class="hex">#FFFFFF</div><div class="m">Superfícies</div></div><div class="c" style="gap:4px;min-width:0"><div class="sw" style="background:#FFF0F8"></div><div class="n">Rosa muito claro</div><div class="hex">#FFF0F8</div><div class="m">Selecionado, fundos suaves</div></div><div class="c" style="gap:4px;min-width:0"><div class="sw" style="background:#F5F5F7"></div><div class="n">Cinza muito claro</div><div class="hex">#F5F5F7</div><div class="m">Fundos, campos</div></div></div></body></html>
