<!-- @dsCard group="Colors" viewport="700x200" name="Status educacionais" subtitle="Chamada e situação financeira — cor + letra/ícone + texto" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Status educacionais</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;font-family:var(--font-body);color:var(--text-primary)}.r{display:flex;gap:12px;flex-wrap:wrap}.c{display:flex;flex-direction:column;gap:8px}.m{font:500 12px/1.4 var(--font-body);color:var(--text-muted)}.n{font:600 13px/1.3 var(--font-body)}.hex{font:12px/1.3 var(--font-mono);color:var(--text-secondary)}.sw{width:100%;height:64px;border-radius:8px;border:1px solid var(--border-subtle)}</style></head><body><div class="c" style="gap:14px"><div><div class="m" style="margin-bottom:8px">Chamada</div><div class="r"><span style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 6px;border-radius:999px;background:var(--success-bg);color:var(--success-fg);font:600 14px var(--font-body)"><span style="width:28px;height:28px;border-radius:50%;background:var(--success-solid);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">P</span>Presente</span><span style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 6px;border-radius:999px;background:var(--danger-bg);color:var(--danger-fg);font:600 14px var(--font-body)"><span style="width:28px;height:28px;border-radius:50%;background:var(--danger-solid);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">F</span>Falta</span><span style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 6px;border-radius:999px;background:var(--info-bg);color:var(--info-fg);font:600 14px var(--font-body)"><span style="width:28px;height:28px;border-radius:50%;background:var(--info-solid);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">J</span>Justificada</span><span style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 6px;border-radius:999px;background:var(--neutral-bg);color:var(--neutral-fg);font:600 14px var(--font-body)"><span style="width:28px;height:28px;border-radius:50%;background:var(--neutral-solid);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">–</span>Não preenchida</span></div></div><div><div class="m" style="margin-bottom:8px">Mensalidade</div><div class="r"><span style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--success-bg);color:var(--success-fg);font:600 13px var(--font-body)">● Pago</span><span style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--warning-bg);color:var(--warning-fg);font:600 13px var(--font-body)">● A vencer</span><span style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--danger-bg);color:var(--danger-fg);font:600 13px var(--font-body)">● Em atraso</span><span style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--info-bg);color:var(--info-fg);font:600 13px var(--font-body)">● Processando</span><span style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--neutral-bg);color:var(--neutral-fg);font:600 13px var(--font-body)">● Acordo ativo</span></div></div></div></body></html>
