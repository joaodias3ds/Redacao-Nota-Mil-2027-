<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Logotipo, marca e símbolo</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;font-family:var(--font-body);color:var(--text-primary)}.r{display:flex;gap:12px;flex-wrap:wrap}.c{display:flex;flex-direction:column;gap:8px}.m{font:500 12px/1.4 var(--font-body);color:var(--text-muted)}.n{font:600 13px/1.3 var(--font-body)}.hex{font:12px/1.3 var(--font-mono);color:var(--text-secondary)}.sw{width:100%;height:64px;border-radius:8px;border:1px solid var(--border-subtle)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px"><div class="c"><div style="height:150px;border:1px solid var(--border-default);border-radius:12px;display:flex;align-items:center;justify-content:center;background:#fff"><img src="../assets/logo-redacao-1000.png" style="width:170px"></div><div class="n">Logotipo completo</div><div class="m">Site, documentos, impressos, splash do app.</div></div><div class="c"><div style="height:150px;border:1px solid var(--border-default);border-radius:12px;display:flex;align-items:center;justify-content:center;background:#fff"><img src="../assets/simbolo-r-livro.png" style="height:110px"></div><div class="n">Símbolo (marca)</div><div class="m">Ícone do app, favicon, avatar de redes, carimbos. Recorte do arquivo original — aguarda aprovação.</div></div><div class="c"><div style="height:150px;border:1px solid var(--border-default);border-radius:12px;display:flex;align-items:center;justify-content:center;background:#fff"><span style="font:600 22px var(--font-display);color:var(--text-primary)">Redação <span style="color:var(--brand)">Nota Mil</span></span></div><div class="n">Nome em texto</div><div class="m">Em frases, e-mails e telas pequenas onde a logo não cabe. Não é uma logo.</div></div></div></body></html>
