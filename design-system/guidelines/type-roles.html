<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Uso por papel</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;font-family:var(--font-body);color:var(--text-primary)}.r{display:flex;gap:12px;flex-wrap:wrap}.c{display:flex;flex-direction:column;gap:8px}.m{font:500 12px/1.4 var(--font-body);color:var(--text-muted)}.n{font:600 13px/1.3 var(--font-body)}.hex{font:12px/1.3 var(--font-mono);color:var(--text-secondary)}.sw{width:100%;height:64px;border-radius:8px;border:1px solid var(--border-subtle)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div class="c"><div style="min-height:150px;border:1px solid var(--border-default);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;justify-content:center"><div style="font:600 18px/1.3 var(--font-display)">Simulado no sábado</div><div style="font:14px/1.5 var(--font-body);color:var(--text-secondary)">Começa às 8h. Traga documento com foto.</div></div><div class="n">Título + texto</div></div><div class="c"><div style="min-height:150px;border:1px solid var(--border-default);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;justify-content:center"><div style="font:600 24px/1.2 var(--font-display)">Boa noite, Ana</div></div><div class="n">Somente título</div></div><div class="c"><div style="min-height:150px;border:1px solid var(--border-default);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;justify-content:center"><div style="font:15px/1.55 var(--font-body)">Sua redação foi recebida e entra na fila de correção da professora Marina.</div></div><div class="n">Somente texto</div></div><div class="c"><div style="min-height:150px;border:1px solid var(--border-default);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;justify-content:center"><div style="font:13px/1.4 var(--font-body);color:var(--text-muted)">Atualizado às 14h32 · 2 alterações aguardando envio</div></div><div class="n">Somente apoio</div></div></div></body></html>
