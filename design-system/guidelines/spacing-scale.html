<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Escala de espaçamento</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;font-family:var(--font-body);color:var(--text-primary)}.r{display:flex;gap:12px;flex-wrap:wrap}.c{display:flex;flex-direction:column;gap:8px}.m{font:500 12px/1.4 var(--font-body);color:var(--text-muted)}.n{font:600 13px/1.3 var(--font-body)}.hex{font:12px/1.3 var(--font-mono);color:var(--text-secondary)}.sw{width:100%;height:64px;border-radius:8px;border:1px solid var(--border-subtle)}</style></head><body><div style="display:flex;gap:18px;align-items:flex-end"><div class="c" style="align-items:center;gap:6px"><div style="width:4px;height:4px;background:var(--brand);border-radius:2px"></div><div class="n">4</div><div class="hex" style="font-size:11px">--space-1</div></div><div class="c" style="align-items:center;gap:6px"><div style="width:8px;height:8px;background:var(--brand);border-radius:2px"></div><div class="n">8</div><div class="hex" style="font-size:11px">--space-2</div></div><div class="c" style="align-items:center;gap:6px"><div style="width:12px;height:12px;background:var(--brand);border-radius:2px"></div><div class="n">12</div><div class="hex" style="font-size:11px">--space-3</div></div><div class="c" style="align-items:center;gap:6px"><div style="width:16px;height:16px;background:var(--brand);border-radius:2px"></div><div class="n">16</div><div class="hex" style="font-size:11px">--space-4</div></div><div class="c" style="align-items:center;gap:6px"><div style="width:24px;height:24px;background:var(--brand);border-radius:2px"></div><div class="n">24</div><div class="hex" style="font-size:11px">--space-6</div></div><div class="c" style="align-items:center;gap:6px"><div style="width:32px;height:32px;background:var(--brand);border-radius:2px"></div><div class="n">32</div><div class="hex" style="font-size:11px">--space-8</div></div><div class="c" style="align-items:center;gap:6px"><div style="width:48px;height:48px;background:var(--brand);border-radius:2px"></div><div class="n">48</div><div class="hex" style="font-size:11px">--space-12</div></div><div class="c" style="align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--brand);border-radius:2px"></div><div class="n">64</div><div class="hex" style="font-size:11px">--space-16</div></div></div><div class="m" style="margin-top:16px">RN: valores numéricos sem unidade (space[4] = 16). Web: px. Não usar valores fora da escala.</div></body></html>
